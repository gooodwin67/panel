<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
   <meta name="mobile-web-app-capable" content="yes">
   <title>Шаблон</title>

   <base href="./" />
   <link rel="icon" type="image/x-icon" href="favicon.ico">
   <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
   <link href="style.css" rel="stylesheet" />

   <script type="module" src="./main.js"></script>
</head>

<body>

   <div class="main_screen">


      <div class="bottom_panel" id="bottom_panel">
         <div class="panel-header">
            <div class="drag-handle"></div>
            <div class="panel-controls">
               <button id="btn-compact" title="Компактный вид">🗕</button>
               <button id="btn-hide" title="Свернуть">⏬</button>
            </div>
         </div>

         <div class="ui-tabs">
            <div class="ui-tab active" data-target="tab-panels">🖼 Панели</div>
            <div class="ui-tab" data-target="tab-lights">💡 Свет</div>
            <div class="ui-tab" data-target="tab-scene">⚙️ Сцена</div>
         </div>

         <div class="ui-tab-content">

            <div class="ui-pane active" id="tab-panels">
               <div class="panels">
                  <div class="panel panel1"><img src="images/panels/panel_1.png" alt="Panel 1"></div>
                  <div class="panel panel2"><img src="images/panels/panel_2.png" alt="Panel 2"></div>
                  <div class="panel panel3"><img src="images/panels/panel_3.png" alt="Panel 3"></div>
                  <div class="panel panel4"><img src="images/panels/panel_4.png" alt="Panel 4"></div>
               </div>
            </div>

            <div class="ui-pane" id="tab-lights">
               <div class="btns">
                  <button id="add-light-bulb" class="action-btn primary">➕ <span class="btn-text">Добавить лампочку</span></button>
               </div>
            </div>

            <div class="ui-pane" id="tab-scene">
               <div class="btns">
                  <button id="random_rotate" class="action-btn">🎲 <span class="btn-text">Случайный поворот</span></button>
                  <button id="random_shuffle" class="action-btn">🔀 <span class="btn-text">Случайное расположение</span></button>
                  <button id="toglle_net" class="action-btn">🔲 <span class="btn-text">Вкл/выкл сетку</span></button>
                  <button id="add-table" class="action-btn primary">🪑 <span class="btn-text">Добавить стол</span></button>
                  <button id="delete-table" class="action-btn">🗑️ <span class="btn-text">Удалить стол</span></button>
                  <button id="add-table-lamp" class="action-btn">💡 <span class="btn-text">Добавить лампу</span></button>
                  <button id="delete-table-lamp" class="action-btn">🗑️ <span class="btn-text">Удалить лампу</span></button>

                  <div class="color-picker-group action-btn">
                     🎨 <span class="btn-text">Цвет:</span>
                     <input type="color" id="wall-color-picker" value="#ffffff">
                  </div>
               </div>
            </div>

         </div>
      </div>

      <script>
         document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.ui-tab');
            const panes = document.querySelectorAll('.ui-pane');
            const panel = document.querySelector('.bottom_panel');

            tabs.forEach(tab => {
               tab.addEventListener('click', () => {
                  // Разворачиваем панель, если она была свернута
                  if (panel.classList.contains('closed')) {
                     panel.classList.remove('closed');
                  }
                  // Переключаем активные классы
                  tabs.forEach(t => t.classList.remove('active'));
                  panes.forEach(p => p.classList.remove('active'));

                  tab.classList.add('active');
                  document.getElementById(tab.dataset.target).classList.add('active');
               });
            });

            const btnCompact = document.getElementById('btn-compact');
            const btnHide = document.getElementById('btn-hide');


            // Логика кнопки "Свернуть в иконки"
            btnCompact.addEventListener('click', () => {
               panel.classList.remove('closed'); // Вытаскиваем, если была скрыта
               panel.classList.toggle('compact'); // Переключаем компактный вид
            });

            // Логика кнопки "Скрыть полностью"
            btnHide.addEventListener('click', () => {
               panel.classList.remove('compact'); // Сбрасываем компактный вид
               panel.classList.toggle('closed');  // Скрываем/открываем панель
            });

         });
      </script>

      <div class="floating-ui selection-ui" id="selection-ui" style="display:none;">
         <div class="ui-header">
            <span class="ui-title">Настройки панели</span>
            <button id="btn-close-sel" class="ui-close-btn">✖</button>
         </div>
         <div class="ui-body">
            <div class="ui-row" style="gap: 10px;">
               <button id="btn-rot-left" class="action-btn" style="flex:1">↺ Влево</button>
               <button id="btn-rot-right" class="action-btn" style="flex:1">Вправо ↻</button>
            </div>

            <div class="ui-row color-picker-group">
               <span>Цвет:</span>
               <input type="color" id="panel-color-picker" value="#ffffff">
            </div>

            <div class="ui-row">
               <button id="btn-all-color" class="action-btn primary" style="width:100%">Применить ко всем</button>
            </div>
         </div>
      </div>

      <div class="floating-ui light-selection-ui" id="light-selection-ui" style="display:none;">
         <div class="ui-header">
            <span class="ui-title">Лампочка</span>
            <button id="btn-close-light" class="ui-close-btn">✖</button>
         </div>
         <div class="ui-body">
            <div class="ui-row color-picker-group">
               <span>Цвет:</span>
               <input type="color" id="light-color-picker" value="#ffaa66">
            </div>
            <div class="ui-row">
               <span>Темп (K):</span>
               <input type="range" id="light-kelvin" min="1000" max="12000" step="50" value="4500">
            </div>
            <div class="ui-row">
               <span>Яркость:</span>
               <input type="range" id="light-intensity" min="0" max="50" step="0.1" value="10">
            </div>
            <div class="ui-row">
               <span>Dist:</span>
               <input type="range" id="light-distance" min="0" max="20" step="0.1" value="3">
            </div>
            <div class="ui-row">
               <span>Decay:</span>
               <input type="range" id="light-decay" min="0" max="5" step="0.01" value="2">
            </div>
            <div class="ui-row">
               <span>Glow:</span>
               <input type="range" id="bulb-emissive" min="0" max="10" step="0.1" value="2">
            </div>
            <div class="ui-row" style="justify-content: space-between;">
               <label class="ui-check">
                  <input type="checkbox" id="bulb-visible" checked>
                  Корпус
               </label>
               <button id="btn-delete-light" class="action-btn" style="background: rgba(255,50,50,0.2); border-color:#ff3232; color:#ff3232; padding: 5px 10px;">Удалить</button>
            </div>
         </div>
      </div>

      <div class="floating-ui furniture-selection-ui" id="furniture-selection-ui" style="display:none;">
         <div class="ui-header">
            <span class="ui-title">????</span>
            <button id="btn-close-furniture" class="ui-close-btn">?</button>
         </div>
         <div class="ui-body">
            <div class="ui-row">
               <span>??????:</span>
               <input type="range" id="furniture-width" min="0.5" max="6" step="0.1" value="2">
            </div>
            <div class="ui-row">
               <span>???????:</span>
               <input type="range" id="furniture-depth" min="0.5" max="6" step="0.1" value="1.5">
            </div>
            <div class="ui-row">
               <span>??? X:</span>
               <input type="range" id="furniture-pos-x" min="-4" max="4" step="0.1" value="0">
            </div>
            <div class="ui-row">
               <span>??? Z:</span>
               <input type="range" id="furniture-pos-z" min="-4" max="4" step="0.1" value="0">
            </div>
            <div class="ui-row">
               <span>Поворот:</span>
               <input type="range" id="furniture-rotation" min="0" max="3" step="1" value="0">
               <span id="furniture-rotation-value">0°</span>
            </div>
            <div class="ui-row">
               <button id="btn-delete-furniture" class="action-btn" style="width:100%; background: rgba(255,50,50,0.2); border-color:#ff3232; color:#ff3232;">Удалить стол</button>
            </div>
         </div>
      </div>

      <div class="floating-ui rug-selection-ui" id="rug-selection-ui" style="display:none;">
         <div class="ui-header">
            <span class="ui-title">Ковер</span>
            <button id="btn-close-rug" class="ui-close-btn">✖</button>
         </div>
         <div class="ui-body">
            <div class="ui-row color-picker-group">
               <span>Цвет оттенка:</span>
               <input type="color" id="rug-color-picker" value="#ffffff">
            </div>
            <div class="ui-row">
               <span>Ширина:</span>
               <input type="range" id="rug-width" min="1" max="8" step="0.1" value="4">
            </div>
            <div class="ui-row">
               <span>Глубина:</span>
               <input type="range" id="rug-depth" min="1" max="8" step="0.1" value="3">
            </div>
            <div class="ui-row">
               <span>Ось X:</span>
               <input type="range" id="rug-pos-x" min="-4" max="4" step="0.1" value="0">
            </div>
            <div class="ui-row">
               <span>Ось Z:</span>
               <input type="range" id="rug-pos-z" min="-4" max="4" step="0.1" value="0">
            </div>
         </div>
      </div>
   </div>

</body>

</html>
