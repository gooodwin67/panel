<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
   <meta name="mobile-web-app-capable" content="yes">
   <title>Шаблон</title>

   <base href="./" />
   <link rel="icon" type="image/x-icon" href="favicon.ico">
   <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
   <link href="style.css" rel="stylesheet" />

   <script type="module" src="./main.js"></script>
</head>

<body>

   <div class="main_screen">


      <div class="bottom_panel">
         <!-- Кнопка сворачивания/разворачивания -->
         <button id="toggle-btn">▼</button>

         <div class="btns">
            <button id="random_rotate">Случайный поворот</button>
            <button id="random_shuffle">Случайное расположение</button>
            <button id="toglle_net">Вкл/выкл сетку</button>
         </div>

         <!-- Цвет стены-->
         <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
            <span style="font-size:14px;">Цвет стены:</span>
            <input type="color" id="wall-color-picker" value="#ffffff" style="width:100%; height:30px; cursor:pointer; border:none; padding:0;">
         </div>

         <!-- лампочки-->
         <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
            <span id="add-light-bulb" class='light_bulb' style="font-size:14px;">лампочка</span>
         </div>


         <div class="panels">
            <div class="panel panel1">
               <img src="img/panel_1.png" alt="Panel 1">
            </div>
            <div class="panel panel2">
               <img src="img/panel_2.png" alt="Panel 2">
            </div>
            <div class="panel panel3">
               <img src="img/panel_3.png" alt="Panel 3">
            </div>
            <div class="panel panel4">
               <img src="img/panel_4.png" alt="Panel 4">
            </div>
         </div>
      </div>

      <div class="light-selection-ui" id="light-selection-ui" style="display:none;">
         <div class="ui-title">Лампочка</div>

         <div class="ui-row">
            <span>Цвет:</span>
            <input type="color" id="light-color-picker" value="#ffaa66">
         </div>

         <div class="ui-row">
            <span>Темп (K):</span>
            <input type="range" id="light-kelvin" min="1000" max="12000" step="50" value="4500">
         </div>

         <div class="ui-row">
            <span>Яркость:</span>
            <input type="range" id="light-intensity" min="0" max="50" step="0.1" value="10">
         </div>

         <div class="ui-row">
            <span>Dist:</span>
            <input type="range" id="light-distance" min="0" max="20" step="0.1" value="3">
         </div>

         <div class="ui-row">
            <span>Decay:</span>
            <input type="range" id="light-decay" min="0" max="5" step="0.01" value="2">
         </div>

         <div class="ui-row ui-row-split">
            <label class="ui-check">
               <input type="checkbox" id="bulb-visible" checked>
               Корпус
            </label>

            <button id="btn-close-light" class="ui-btn">Закрыть</button>
         </div>

         <div class="ui-row">
            <span>Glow:</span>
            <input type="range" id="bulb-emissive" min="0" max="10" step="0.1" value="2">
         </div>

         <button id="btn-delete-light" class="ui-btn ui-btn-danger">Удалить лампочку</button>
      </div>
   </div>

</body>

</html>
